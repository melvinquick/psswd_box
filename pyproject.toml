[project]
name = "psswd_box"
version = "3.0.0"
description = "Password generator that never leaves your machine."
readme = "README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.12.0", "pyyaml>=6.0.3"]

[project.urls]
repository = "https://github.com/melvinquick/psswd_box"
issues = "https://github.com/melvinquick/psswd_box/issues"

[project.gui-scripts]
psswd-box = "psswd_box.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.9.4"]
