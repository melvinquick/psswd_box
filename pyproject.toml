[project]
name = "psswd_box"
version = "2.0.0"
description = "Password generator that never leaves your machine."
readme = "src/psswd_box/resources/PYPI_README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.10"
dependencies = ["pyside6>=6.8.2.1", "pyyaml>=6.0.2"]

[project.urls]
repository = "https://github.com/melvinquick/psswd_box"
issues = "https://github.com/melvinquick/psswd_box/issues"

[project.gui-scripts]
psswd-box = "psswd_box.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.8.3"]
